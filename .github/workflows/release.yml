name: release

# Push a tag like v1.0 (git tag v1.0 && git push origin v1.0): this builds every tool from source,
# packs the release archives, adds SHA-256 checksums and publishes a GitHub Release with the notes from
# the newest section of CHANGELOG.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Build
        shell: cmd
        run: scripts\build.bat

      - name: Test
        shell: cmd
        run: scripts\test.bat

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      # the .pdb files of this build, kept with the run (not in the release archives)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pdb
          path: out/*.pdb
          if-no-files-found: error

      - name: Checksums and release notes
        shell: pwsh
        run: |
          $sums = Get-ChildItem dist/*.zip | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name
          }
          # LF line ends: sha256sum -c (Linux, Steam Deck) reads a CR as part of the file name
          [IO.File]::WriteAllText((Join-Path (Resolve-Path dist) 'SHA256SUMS.txt'), ($sums -join "`n") + "`n")
          # Notes = the newest "## ..." section of CHANGELOG.md, plus install pointers.
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $next  = ($lines | Select-String -Pattern '^## ' | Select-Object -Skip 1 -First 1).LineNumber
          $end   = if ($next) { $next - 2 } else { $lines.Count - 1 }
          $notes = $lines[$start..$end] -join "`n"
          $notes += "`n`n**Install:** each archive extracts into the game folder; see the docs in the repository. "
          $notes += "Avengers Mod Loader is optional if Avengers ScriptHook works for you.`n"
          $notes += "Checksums: SHA256SUMS.txt. Licence: see LICENSE."
          Set-Content -Encoding utf8 dist/NOTES.md $notes

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $files = (Get-ChildItem dist/*.zip).FullName + (Resolve-Path dist/SHA256SUMS.txt).Path
          gh release create $tag @files --title "AvengersGame-tools $tag" --notes-file dist/NOTES.md --verify-tag

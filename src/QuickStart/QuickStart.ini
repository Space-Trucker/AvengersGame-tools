; Quick Start settings: 1 = on, 0 = off. Restart the game after a change.
[QuickStart]
; keep loading and running when the game window is not in front
NoPauseWhenUnfocused=1
; skip the photosensitivity (epilepsy) warning screen
SkipEpilepsyWarning=1
; don't wait 3 seconds on the legal screen
SkipLegalWait=1
; skip the intro movie
SkipIntroMovie=1
; press "any key" on the title screen for you, so the profile loads and the main menu opens
AutoPressStart=1
